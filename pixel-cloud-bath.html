<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>幻梦云端浴 · Dreamio Pixel Cloud Bath</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e0b20;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      display: block;
    }
    /* Girl container overlay */
    #girl-container {
      position: absolute;
      pointer-events: none;
      transition: all 0.15s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    /* Floating HUD */
    .hud-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 30;
    }
    .hud-pill {
      background: rgba(23, 16, 50, 0.88);
      border: 1px solid rgba(165, 142, 225, 0.45);
      border-radius: 9999px;
      padding: 6px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .level-btn {
      background: rgba(40, 27, 80, 0.8);
      border: 1px solid rgba(165, 142, 225, 0.3);
      color: #ddd6fe;
      border-radius: 9999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }
    .level-btn:hover {
      background: #382670;
      color: #fff;
    }
    .level-btn.active {
      background: linear-gradient(to right, #fbbf24, #f59e0b);
      color: #1c1917;
      border-color: #fde047;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
      transform: scale(1.05);
    }
    .restart-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(30, 19, 61, 0.9);
      border: 2px solid #fbbf24;
      color: #fde047;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
      transition: transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .restart-btn:active {
      transform: scale(0.9);
    }
    /* Bottom Hint Bar */
    .bottom-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 17, 54, 0.85);
      border: 1px solid rgba(165, 142, 225, 0.35);
      border-radius: 9999px;
      padding: 6px 20px;
      font-size: 11px;
      font-weight: 700;
      color: #e0e7ff;
      pointer-events: none;
      z-index: 30;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    /* Victory Modal */
    #victory-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: linear-gradient(to bottom, #24184a, #1f1442, #160c33);
      border: 3px solid rgba(251, 191, 36, 0.85);
      border-radius: 24px;
      padding: 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 50px rgba(251, 191, 36, 0.45);
      color: #fff;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #fbbf24, #f59e0b, #ea580c);
      color: #1c1917;
      font-size: 14px;
      font-weight: 900;
      border: 2px solid #fde047;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.5);
      transition: transform 0.15s;
    }
    .modal-btn:hover {
      transform: scale(1.02);
    }
    .modal-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Fullscreen Interactive Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- The 1:1 Exact Pixel Girl sitting on top of the clouds in her tub -->
    <div id="girl-container"></div>

    <!-- Floating HUD -->
    <div class="hud-bar">
      <!-- Left: Title & Level Selector -->
      <div style="display: flex; align-items: center; gap: 8px; pointer-events: auto;">
        <div class="hud-pill" style="color: #fde047;">
          <span>🌙</span>
          <span id="level-name">幻梦天都 · 霞光云海</span>
        </div>
        <div class="hud-pill" id="level-buttons" style="padding: 4px 8px;">
          <!-- Generated via JS -->
        </div>
      </div>

      <!-- Center: 3 Star Ducks -->
      <div class="hud-pill" id="duck-icons" style="font-size: 22px; gap: 6px;">
        <span class="duck-star" style="opacity: 0.25;">🐥</span>
        <span class="duck-star" style="opacity: 0.25;">🐥</span>
        <span class="duck-star" style="opacity: 0.25;">🐥</span>
      </div>

      <!-- Right: Water Meter & Reset -->
      <div style="display: flex; align-items: center; gap: 10px; pointer-events: auto;">
        <div class="hud-pill">
          <span style="color: #67e8f9;">浴池蓄水:</span>
          <div style="width: 90px; height: 16px; background: #0c081e; border: 1px solid rgba(103, 232, 249, 0.6); border-radius: 9999px; overflow: hidden; padding: 2px;">
            <div id="water-bar" style="width: 0%; height: 100%; background: linear-gradient(to right, #38bdf8, #818cf8); border-radius: 9999px; transition: width 0.15s; box-shadow: 0 0 8px #38bdf8;"></div>
          </div>
          <span id="water-pct" style="color: #a5f3fc; font-weight: 900;">0%</span>
        </div>
        <button class="restart-btn" id="restart-btn" title="重玩本关">↺</button>
      </div>
    </div>

    <!-- Bottom Hint -->
    <div class="bottom-hint">
      ☁️ 鼠标按住划动挖开白色与彩色云朵 • ✨ 引导天泉瀑布流入云端浴池！
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal">
      <div class="modal-card">
        <div style="font-size: 44px; margin-bottom: 8px;">✨ 🫧 ✨</div>
        <h3 style="font-size: 22px; font-weight: 900; color: #fde047; margin-bottom: 6px;">仙泉满溢！暖汤开泡！</h3>
        <p style="font-size: 12px; color: #ddd6fe; margin-bottom: 16px;">
          云朵被拨开，纯净星泉流入云端浴池！小女孩开心地泡在暖汤里冒起粉嫩泡泡～
        </p>
        <div id="modal-ducks" style="font-size: 34px; margin-bottom: 16px; background: rgba(17, 11, 40, 0.85); padding: 10px; border-radius: 16px; border: 1px solid rgba(165, 142, 225, 0.4);">
          🐥 🐥 🐥
        </div>
        <div style="background: rgba(45, 27, 84, 0.8); border: 1px solid rgba(165, 142, 225, 0.3); border-radius: 12px; padding: 10px; font-size: 12px; color: #fde047; font-weight: 800; margin-bottom: 18px;">
          🎟️ 恭喜获得街机奖券: +<span id="reward-tickets">11</span> 张！
        </div>
        <button class="modal-btn" id="next-level-btn">飞向下一片云海 →</button>
        <button id="stay-btn" style="background: none; border: none; color: #c4b5fd; font-size: 12px; font-weight: 700; margin-top: 12px; cursor: pointer;">留在当前画面欣赏云景</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
     * 1. 1:1 EXACT PIXEL GIRL SVG PATHS (Pixel-for-pixel reconstruction)
     * ========================================================================= */
    const PIXEL_GIRL_PATHS = {
      K: { color: "#110e10", d: "M13 0h8v1h-8zM10 1h3v1h-3zM21 1h2v1h-2zM8 2h2v1h-2zM23 2h2v1h-2zM7 3h1v1h-1zM25 3h1v1h-1zM6 4h1v1h-1zM26 4h1v1h-1zM5 5h1v1h-1zM27 5h1v1h-1zM4 6h1v1h-1zM28 6h1v1h-1zM3 7h1v1h-1zM29 7h1v1h-1zM3 8h1v1h-1zM29 8h1v1h-1zM3 9h1v1h-1zM14 9h1v1h-1zM29 9h1v1h-1zM2 10h1v1h-1zM13 10h1v1h-1zM30 10h1v1h-1zM2 11h1v1h-1zM12 11h1v1h-1zM16 11h1v1h-1zM30 11h1v1h-1zM2 12h1v1h-1zM12 12h1v1h-1zM16 12h1v1h-1zM30 12h1v1h-1zM2 13h1v1h-1zM11 13h1v1h-1zM15 13h1v1h-1zM19 13h1v1h-1zM30 13h1v1h-1zM2 14h1v1h-1zM11 14h1v1h-1zM14 14h1v1h-1zM20 14h1v1h-1zM30 14h1v1h-1zM2 15h1v1h-1zM10 15h1v1h-1zM12 15h2v1h-2zM15 15h7v1h-7zM30 15h1v1h-1zM3 16h1v1h-1zM9 16h1v1h-1zM22 16h2v1h-2zM30 16h1v1h-1zM0 17h1v1h-1zM3 17h1v1h-1zM9 17h1v1h-1zM24 17h1v1h-1zM29 17h1v1h-1zM1 18h1v1h-1zM3 18h1v1h-1zM5 18h2v1h-2zM8 18h1v1h-1zM24 18h1v1h-1zM29 18h1v1h-1zM2 19h1v1h-1zM4 19h1v1h-1zM8 19h1v1h-1zM25 19h1v1h-1zM27 19h2v1h-2zM2 20h1v1h-1zM4 20h1v1h-1zM8 20h1v1h-1zM25 20h1v1h-1zM29 20h1v1h-1zM1 21h1v1h-1zM5 21h2v1h-2zM8 21h1v1h-1zM25 21h1v1h-1zM29 21h1v1h-1zM1 22h1v1h-1zM8 22h1v1h-1zM25 22h1v1h-1zM27 22h2v1h-2zM1 23h1v1h-1zM9 23h1v1h-1zM25 23h2v1h-2zM2 24h1v1h-1zM9 24h1v1h-1zM25 24h1v1h-1zM3 25h1v1h-1zM7 25h2v1h-2zM24 25h1v1h-1zM23 26h1v1h-1z" },
      H: { color: "#362a29", d: "M13 1h8v1h-8zM10 2h13v1h-13zM8 3h17v1h-17zM7 4h19v1h-19zM6 5h21v1h-21zM5 6h23v1h-23zM4 7h3v1h-3zM8 7h12v1h-12zM22 7h7v1h-7zM4 8h3v1h-3zM10 8h10v1h-10zM23 8h1v1h-1zM26 8h3v1h-3zM4 9h4v1h-4zM11 9h3v1h-3zM15 9h5v1h-5zM23 9h1v1h-1zM26 9h3v1h-3zM3 10h10v1h-10zM14 10h16v1h-16zM3 11h9v1h-9zM13 11h3v1h-3zM17 11h13v1h-13zM3 12h9v1h-9zM13 12h3v1h-3zM17 12h13v1h-13zM3 13h8v1h-8zM12 13h3v1h-3zM16 13h3v1h-3zM20 13h6v1h-6zM27 13h3v1h-3zM3 14h8v1h-8zM12 14h2v1h-2zM15 14h5v1h-5zM21 14h4v1h-4zM26 14h4v1h-4zM3 15h7v1h-7zM22 15h2v1h-2zM25 15h5v1h-5zM4 16h5v1h-5zM24 16h6v1h-6zM4 17h5v1h-5zM25 17h4v1h-4zM4 18h1v1h-1zM7 18h1v1h-1zM25 18h4v1h-4zM3 19h1v1h-1zM7 19h1v1h-1zM26 19h1v1h-1zM3 20h1v1h-1zM7 20h1v1h-1zM26 20h1v1h-1zM2 21h3v1h-3zM7 21h1v1h-1zM26 21h1v1h-1zM2 22h6v1h-6zM26 22h1v1h-1zM2 23h7v1h-7zM3 24h6v1h-6zM4 25h3v1h-3z" },
      W: { color: "#ffffff", d: "M7 7h1v1h-1zM20 7h2v1h-2zM7 8h3v1h-3zM20 8h3v1h-3zM24 8h2v1h-2zM8 9h3v1h-3zM20 9h3v1h-3zM24 9h2v1h-2zM10 24h1v1h-1zM24 24h1v1h-1zM9 25h4v1h-4zM21 25h3v1h-3zM10 26h3v1h-3zM19 26h4v1h-4zM10 27h2v1h-2zM16 27h1v1h-1zM18 27h6v1h-6zM10 28h3v1h-3zM14 28h2v1h-2zM19 28h5v1h-5zM12 29h1v1h-1zM14 29h2v1h-2zM17 29h1v1h-1zM19 29h3v1h-3zM14 30h2v1h-2zM19 30h2v1h-2zM15 31h6v1h-6zM16 33h1v1h-1zM20 33h1v1h-1zM14 34h1v1h-1zM18 34h1v1h-1zM15 36h1v1h-1zM14 37h1v1h-1zM19 37h1v1h-1zM14 39h3v1h-3zM18 39h3v1h-3z" },
      R: { color: "#cb1639", d: "M26 13h1v1h-1zM25 14h1v1h-1zM24 15h1v1h-1z" },
      F: { color: "#fff5ee", d: "M11 15h1v1h-1zM14 15h1v1h-1zM10 16h12v1h-12zM10 17h14v1h-14zM9 18h3v1h-3zM14 18h7v1h-7zM23 18h1v1h-1zM5 19h2v1h-2zM9 19h3v1h-3zM14 19h7v1h-7zM23 19h2v1h-2zM5 20h2v1h-2zM9 20h3v1h-3zM14 20h7v1h-7zM23 20h2v1h-2zM27 20h2v1h-2zM9 21h2v1h-2zM14 21h7v1h-7zM24 21h1v1h-1zM27 21h2v1h-2zM9 22h2v1h-2zM14 22h3v1h-3zM18 22h3v1h-3zM24 22h1v1h-1zM11 23h13v1h-13zM13 24h8v1h-8zM14 26h2v1h-2zM17 26h1v1h-1zM12 27h1v1h-1zM14 27h2v1h-2zM11 30h2v1h-2zM21 30h2v1h-2zM10 31h3v1h-3zM21 31h3v1h-3zM10 32h2v1h-2zM22 32h3v1h-3z" },
      S: { color: "#b3a398", d: "M10 23h1v1h-1zM24 23h1v1h-1zM11 24h2v1h-2zM21 24h3v1h-3zM13 25h8v1h-8z" },
      P: { color: "#fca7b5", d: "M11 21h3v1h-3zM21 21h3v1h-3zM11 22h3v1h-3zM21 22h3v1h-3z" },
      M: { color: "#ce9ba5", d: "M17 22h1v1h-1z" },
      E: { color: "#604743", d: "M12 18h2v1h-2zM21 18h2v1h-2zM12 19h2v1h-2zM21 19h2v1h-2zM12 20h2v1h-2zM21 20h2v1h-2z" },
      N: { color: "#848287", d: "M16 26h1v1h-1zM18 26h1v1h-1zM17 27h1v1h-1zM16 28h3v1h-3zM16 29h1v1h-1zM18 29h1v1h-1zM16 30h3v1h-3z" },
      A: { color: "#b7b7b8", d: "M11 29h1v1h-1zM22 29h1v1h-1zM10 30h1v1h-1zM23 30h1v1h-1zM9 31h1v1h-1zM24 31h1v1h-1zM9 32h1v1h-1zM21 32h1v1h-1zM25 32h1v1h-1zM10 33h2v1h-2zM22 33h2v1h-2z" },
      B: { color: "#4d3d26", d: "M13 26h1v1h-1zM13 27h1v1h-1zM13 28h1v1h-1zM13 29h1v1h-1zM13 30h1v1h-1zM13 31h2v1h-2zM12 32h3v1h-3zM12 33h2v1h-2z" },

    };

    function renderPixelGirlSvg(waterLevel, isBathing) {
      let pathsSvg = "";
      for (const key in PIXEL_GIRL_PATHS) {
        pathsSvg += `<path d="${PIXEL_GIRL_PATHS[key].d}" fill="${PIXEL_GIRL_PATHS[key].color}" />`;
      }

      const waterY = 24 - (waterLevel / 100) * 16;
      const waterH = 14 + (waterLevel / 100) * 16;

      const bubblesSvg = isBathing ? `
        <div style="position: absolute; top: -38px; display: flex; align-items: center; gap: 8px; animation: bounce 1s infinite;">
          <span style="color: #67e8f9; font-size: 20px; filter: drop-shadow(0 0 8px #38bdf8);">🫧</span>
          <span style="color: #f472b6; font-size: 16px; font-weight: 900;">♥</span>
          <span style="color: #fde047; font-size: 18px;">✨</span>
          <span style="color: #67e8f9; font-size: 22px;">🫧</span>
        </div>
      ` : "";

      return `
        ${bubblesSvg}
        <svg viewBox="0 0 100 115" style="width: 100%; height: 100%; image-rendering: pixelated; shape-rendering: crispEdges; overflow: visible;">
          <!-- 1:1 Pixel Character placed inside tub, feet landing at y=82 -->
          <g transform="translate(19, 2) scale(2)">
            ${pathsSvg}
          </g>

          <!-- Dreamio Celestial Cloud Hot Spring Bath -->
          <g transform="translate(6, 72)">
            <!-- Cloud Base Cushion -->
            <g fill="#ffffff" opacity="0.95">
              <circle cx="10" cy="38" r="9" />
              <circle cx="26" cy="40" r="10" />
              <circle cx="44" cy="41" r="10.5" />
              <circle cx="62" cy="40" r="10" />
              <circle cx="78" cy="38" r="9" />
              <ellipse cx="44" cy="44" rx="42" ry="4" fill="#c4b5fd" opacity="0.5" />
            </g>

            <!-- Tub Back wall -->
            <rect x="6" y="2" width="76" height="36" rx="8" fill="#6d4830" stroke="#2a1608" stroke-width="2.5" />

            <!-- Shimmering Starlight Water -->
            <rect x="8" y="${waterY}" width="72" height="${waterH}" rx="4" fill="#38bdf8" opacity="0.92" />
            <line x1="14" y1="${waterY + 2}" x2="32" y2="${waterY + 2}" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />

            <!-- Tub Front Planks -->
            <rect x="4" y="10" width="80" height="28" rx="6" fill="#8c5832" stroke="#2a1608" stroke-width="2.5" />
            <line x1="24" y1="10" x2="24" y2="38" stroke="#5c3518" stroke-width="1.8" />
            <line x1="44" y1="10" x2="44" y2="38" stroke="#5c3518" stroke-width="1.8" />
            <line x1="64" y1="10" x2="64" y2="38" stroke="#5c3518" stroke-width="1.8" />
            <rect x="3" y="15" width="82" height="3.5" fill="#f59e0b" stroke="#78350f" stroke-width="1.2" />
            <rect x="3" y="28" width="82" height="3.5" fill="#f59e0b" stroke="#78350f" stroke-width="1.2" />

            <!-- Flowers & Mini Lantern -->
            <g transform="translate(1, 14)">
              <circle cx="2" cy="0" r="3" fill="#f472b6" /><circle cx="6" cy="-2" r="3" fill="#c084fc" /><circle cx="3" cy="1" r="1.2" fill="#fef08a" />
            </g>
            <g transform="translate(76, 12)">
              <circle cx="3" cy="0" r="3" fill="#f472b6" /><circle cx="6" cy="4" r="2.8" fill="#60a5fa" />
              <rect x="5" y="-10" width="6" height="8" rx="2" fill="#fef08a" stroke="#78350f" stroke-width="1" />
            </g>

            <!-- Yellow Rubber Duck -->
            <g transform="translate(58, ${12 - (waterLevel / 100) * 6})">
              <ellipse cx="6" cy="6" rx="6" ry="4" fill="#fbbf24" stroke="#78350f" stroke-width="1.2" />
              <circle cx="8" cy="3" r="3.5" fill="#fde047" stroke="#78350f" stroke-width="1.2" />
              <polygon points="11,3 14,4 11,5" fill="#ea580c" />
              <circle cx="9" cy="2.5" r="0.7" fill="#000" />
            </g>
          </g>
        </svg>
      `;
    }

    /* =========================================================================
     * 2. AUDIO SYNTHESIZER (Web Audio API)
     * ========================================================================= */
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.lastDig = 0;
      }
      getCtx() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
        return this.ctx;
      }
      dig() {
        const now = performance.now();
        if (now - this.lastDig < 50) return;
        this.lastDig = now;
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        osc.type = "sine";
        osc.frequency.setValueAtTime(320 + Math.random() * 80, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.08);
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(450, ctx.currentTime);
        gain.gain.setValueAtTime(0.07, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      }
      splash() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(700 + Math.random() * 300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      }
      duck() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(380, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(560, ctx.currentTime + 0.08);
        osc.frequency.linearRampToValueAtTime(400, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      }
      victory() {
        const ctx = this.getCtx();
        if (!ctx) return;
        [440, 554.37, 659.25, 880, 1108.73].forEach((f, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
          gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + i * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.08);
          osc.stop(ctx.currentTime + i * 0.08 + 0.45);
        });
      }
    }
    const audio = new SoundSynth();

    /* =========================================================================
     * 3. CELL CONSTANTS & CLOUD HELPERS
     * ========================================================================= */
    const CELL_AIR = 0;
    const CELL_CLOUD_WHITE = 1;
    const CELL_ROCK = 2;
    const CELL_WOOD = 3;
    const CELL_CLOUD_PINK = 4;
    const CELL_CLOUD_LAVENDER = 5;
    const CELL_CLOUD_PEACH = 6;

    function isCloud(c) {
      return c === 1 || c === 4 || c === 5 || c === 6;
    }

    /* =========================================================================
     * 4. LEVEL CONFIGURATION (Full-screen Dynamic Clouds)
     * ========================================================================= */
    const LEVELS = [
      {
        number: "01",
        name: "幻梦天都 · 霞光云海",
        tubRatio: { x: 0.68, y: 0.78, w: 20, h: 9, targetWater: 28 },
        spawners: [{ xRatio: 0.48, yRatio: 0.08, count: 200 }],
        ducks: [{ xRatio: 0.28, yRatio: 0.4 }, { xRatio: 0.64, yRatio: 0.52 }, { xRatio: 0.38, yRatio: 0.65 }]
      },
      {
        number: "02",
        name: "浮岛天宫 · 星廊云涧",
        tubRatio: { x: 0.4, y: 0.78, w: 20, h: 9, targetWater: 30 },
        spawners: [{ xRatio: 0.26, yRatio: 0.08, count: 110 }, { xRatio: 0.72, yRatio: 0.08, count: 110 }],
        ducks: [{ xRatio: 0.24, yRatio: 0.45 }, { xRatio: 0.74, yRatio: 0.45 }, { xRatio: 0.49, yRatio: 0.68 }]
      },
      {
        number: "03",
        name: "星月天阶 · 幻境瀑布",
        tubRatio: { x: 0.66, y: 0.78, w: 20, h: 9, targetWater: 32 },
        spawners: [{ xRatio: 0.3, yRatio: 0.08, count: 220 }],
        ducks: [{ xRatio: 0.74, yRatio: 0.38 }, { xRatio: 0.26, yRatio: 0.54 }, { xRatio: 0.7, yRatio: 0.7 }]
      }
    ];

    /* =========================================================================
     * 5. GAME ENGINE
     * ========================================================================= */
    class GameEngine {
      constructor() {
        this.canvas = document.getElementById("game-canvas");
        this.ctx = this.canvas.getContext("2d");
        this.girlContainer = document.getElementById("girl-container");

        this.currentLevelIdx = 0;
        this.cellSize = 12;
        this.W = 0;
        this.H = 0;

        this.grid = new Uint8Array(0);
        this.particles = [];
        this.ducks = [];
        this.crumbs = [];
        this.waterCollected = 0;
        this.waterPercent = 0;
        this.isCompleted = false;
        this.isPointerDown = false;

        this.setupEvents();
        this.resize();
        this.initLevel(0);
        this.loop(performance.now());
      }

      setupEvents() {
        window.addEventListener("resize", () => {
          this.resize();
          this.initLevel(this.currentLevelIdx);
        });

        const dig = (e) => {
          if (!this.isPointerDown) return;
          const rect = this.canvas.getBoundingClientRect();
          const px = e.clientX - rect.left;
          const py = e.clientY - rect.top;
          const gx = Math.floor(px / this.cellSize);
          const gy = Math.floor(py / this.cellSize);
          const r = 3.6;
          let dug = false;

          for (let dy = -Math.ceil(r); dy <= Math.ceil(r); dy++) {
            for (let dx = -Math.ceil(r); dx <= Math.ceil(r); dx++) {
              if (dx * dx + dy * dy <= r * r) {
                const nx = gx + dx;
                const ny = gy + dy;
                if (nx >= 0 && nx < this.W && ny >= 0 && ny < this.H) {
                  const idx = ny * this.W + nx;
                  const c = this.grid[idx];
                  if (isCloud(c)) {
                    this.grid[idx] = CELL_AIR;
                    dug = true;
                    if (Math.random() < 0.45) {
                      const isStar = Math.random() < 0.28;
                      let col = "#ffffff";
                      if (c === CELL_CLOUD_PINK) col = Math.random() > 0.5 ? "#fbcfe8" : "#f472b6";
                      else if (c === CELL_CLOUD_LAVENDER) col = Math.random() > 0.5 ? "#ede9fe" : "#c4b5fd";
                      else if (c === CELL_CLOUD_PEACH) col = Math.random() > 0.5 ? "#fed7aa" : "#fba875";

                      this.crumbs.push({
                        x: nx * this.cellSize + this.cellSize / 2,
                        y: ny * this.cellSize + this.cellSize / 2,
                        vx: (Math.random() - 0.5) * 2.2,
                        vy: -Math.random() * 1.8 - 0.3,
                        radius: isStar ? 2.5 : 4 + Math.random() * 5,
                        life: 1,
                        maxLife: 1,
                        color: isStar ? "#fef08a" : col,
                        isStar
                      });
                    }
                  }
                }
              }
            }
          }
          if (dug) audio.dig();
        };

        this.canvas.addEventListener("pointerdown", (e) => {
          this.isPointerDown = true;
          this.canvas.setPointerCapture(e.pointerId);
          dig(e);
        });
        this.canvas.addEventListener("pointermove", dig);
        this.canvas.addEventListener("pointerup", () => { this.isPointerDown = false; });
        this.canvas.addEventListener("pointercancel", () => { this.isPointerDown = false; });

        document.getElementById("restart-btn").addEventListener("click", () => {
          this.initLevel(this.currentLevelIdx);
        });
        document.getElementById("next-level-btn").addEventListener("click", () => {
          document.getElementById("victory-modal").style.display = "none";
          this.initLevel((this.currentLevelIdx + 1) % LEVELS.length);
        });
        document.getElementById("stay-btn").addEventListener("click", () => {
          document.getElementById("victory-modal").style.display = "none";
        });
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.W = Math.max(60, Math.floor(this.canvas.width / this.cellSize));
        this.H = Math.max(50, Math.floor(this.canvas.height / this.cellSize));
      }

      initLevel(idx) {
        this.currentLevelIdx = idx;
        const lvl = LEVELS[idx];
        document.getElementById("level-name").textContent = lvl.name;
        document.getElementById("victory-modal").style.display = "none";

        // Build Level Switcher buttons
        const btnBox = document.getElementById("level-buttons");
        btnBox.innerHTML = "";
        LEVELS.forEach((l, i) => {
          const b = document.createElement("button");
          b.className = `level-btn ${i === idx ? "active" : ""}`;
          b.textContent = l.number;
          b.onclick = () => this.initLevel(i);
          btnBox.appendChild(b);
        });

        const W = this.W;
        const H = this.H;
        this.grid = new Uint8Array(W * H);
        this.waterCollected = 0;
        this.waterPercent = 0;
        this.isCompleted = false;
        this.crumbs = [];
        this.updateHUD();

        const tubX = Math.floor(W * lvl.tubRatio.x);
        const tubY = Math.floor(H * lvl.tubRatio.y);
        const tubW = lvl.tubRatio.w;
        const tubH = lvl.tubRatio.h;
        this.tub = { x: tubX, y: tubY, w: tubW, h: tubH, target: lvl.tubRatio.targetWater };

        // Position Pixel Girl on top of clouds
        this.girlContainer.style.left = `${tubX * this.cellSize - 20}px`;
        this.girlContainer.style.top = `${tubY * this.cellSize - 95}px`;
        this.girlContainer.style.width = `${tubW * this.cellSize + 40}px`;
        this.girlContainer.style.height = `140px`;
        this.girlContainer.innerHTML = renderPixelGirlSvg(0, false);

        // Generate Clouds Ocean (Filling the lower screen!)
        const startY = Math.floor(H * 0.22);
        for (let y = startY; y < H - 1; y++) {
          for (let x = 2; x < W - 2; x++) {
            const noise = Math.sin(x * 0.18) * Math.cos(y * 0.15) + Math.sin((x + y) * 0.12);
            if (noise > 0.5) this.grid[y * W + x] = CELL_CLOUD_PINK;
            else if (noise > 0.1) this.grid[y * W + x] = CELL_CLOUD_WHITE;
            else if (noise > -0.3) this.grid[y * W + x] = CELL_CLOUD_LAVENDER;
            else this.grid[y * W + x] = CELL_CLOUD_PEACH;
          }
        }

        // Borders
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (x < 2 || x >= W - 2 || y >= H - 1) this.grid[y * W + x] = CELL_ROCK;
          }
        }

        // Solid cloud foundation directly beneath the tub
        for (let y = tubY + 8; y < H - 1; y++) {
          for (let x = tubX - 4; x <= tubX + 24; x++) {
            this.grid[y * W + x] = CELL_CLOUD_WHITE;
          }
        }
        // Air pocket inside tub intake
        for (let y = tubY - 1; y <= tubY + 7; y++) {
          for (let x = tubX; x < tubX + tubW; x++) {
            this.grid[y * W + x] = CELL_AIR;
          }
        }

        // Top Sky Reservoir & Cloud Plug
        const resX0 = Math.floor(W * (lvl.spawners[0].xRatio - 0.12));
        const resX1 = Math.floor(W * (lvl.spawners[0].xRatio + 0.12));
        const resY1 = Math.floor(H * 0.16);
        for (let x = resX0 - 2; x <= resX1 + 2; x++) {
          this.grid[(resY1 + 1) * W + x] = CELL_ROCK;
        }
        for (let x = resX0 + 4; x <= resX1 - 4; x++) {
          this.grid[(resY1 + 1) * W + x] = CELL_CLOUD_WHITE;
          this.grid[(resY1 + 2) * W + x] = CELL_CLOUD_PINK;
        }

        // Stone Ledges & Pillars
        if (idx === 0) {
          for (let y = Math.floor(H * 0.46); y <= Math.floor(H * 0.49); y++) {
            for (let x = Math.floor(W * 0.2); x <= Math.floor(W * 0.38); x++) this.grid[y * W + x] = CELL_ROCK;
          }
          for (let y = Math.floor(H * 0.58); y <= Math.floor(H * 0.61); y++) {
            for (let x = Math.floor(W * 0.52); x <= Math.floor(W * 0.72); x++) this.grid[y * W + x] = CELL_ROCK;
          }
        } else if (idx === 1) {
          const midX = Math.floor(W * 0.48);
          for (let y = Math.floor(H * 0.05); y <= Math.floor(H * 0.55); y++) {
            for (let x = midX - 2; x <= midX + 2; x++) this.grid[y * W + x] = CELL_ROCK;
          }
        }

        // Celestial Star Ducks
        this.ducks = lvl.ducks.map(d => ({
          x: Math.floor(W * d.xRatio),
          y: Math.floor(H * d.yRatio),
          isCollected: false,
          fillLevel: 0
        }));
        this.ducks.forEach(d => {
          for (let dy = -3; dy <= 3; dy++) {
            for (let dx = -3; dx <= 3; dx++) {
              if (dx * dx + dy * dy <= 9) this.grid[(d.y + dy) * W + (d.x + dx)] = CELL_AIR;
            }
          }
        });

        // Spawn Water Particles
        this.particles = [];
        lvl.spawners.forEach(s => {
          const sx = Math.floor(W * s.xRatio);
          const sy = Math.floor(H * s.yRatio);
          for (let i = 0; i < s.count; i++) {
            this.particles.push({
              x: sx + (Math.random() - 0.5) * 14,
              y: sy + (Math.random() - 0.5) * 8,
              vx: (Math.random() - 0.5) * 0.4,
              vy: Math.random() * 0.2
            });
          }
        });
      }

      updateHUD() {
        document.getElementById("water-bar").style.width = `${this.waterPercent}%`;
        document.getElementById("water-pct").textContent = `${this.waterPercent}%`;
        const duckEls = document.querySelectorAll(".duck-star");
        this.ducks.forEach((d, i) => {
          if (duckEls[i]) {
            duckEls[i].style.opacity = d.isCollected ? "1" : "0.25";
            duckEls[i].style.transform = d.isCollected ? "scale(1.15)" : "scale(1)";
          }
        });
      }

      loop(currentTime) {
        requestAnimationFrame((t) => this.loop(t));
        const dt = 0.016;
        const W = this.W;
        const H = this.H;
        const grid = this.grid;
        const particles = this.particles;

        // Physics Update
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.vy += 13.5 * dt;
          p.vx *= 0.985;
          p.vy = Math.min(p.vy, 15);

          const steps = 2;
          const subDt = dt / steps;
          for (let s = 0; s < steps; s++) {
            const nextX = p.x + p.vx * subDt;
            const nextY = p.y + p.vy * subDt;
            const cx = Math.floor(nextX);
            const cy = Math.floor(nextY);

            if (cx < 0 || cx >= W || cy >= H) {
              particles.splice(i, 1);
              break;
            }

            // Tub collection
            if (cx >= this.tub.x && cx < this.tub.x + this.tub.w && cy >= this.tub.y && cy < this.tub.y + this.tub.h) {
              particles.splice(i, 1);
              this.waterCollected++;
              audio.splash();
              this.waterPercent = Math.min(100, Math.round((this.waterCollected / this.tub.target) * 100));
              this.updateHUD();
              this.girlContainer.innerHTML = renderPixelGirlSvg(this.waterPercent, this.isCompleted);

              if (this.waterCollected >= this.tub.target && !this.isCompleted) {
                this.isCompleted = true;
                audio.victory();
                this.girlContainer.innerHTML = renderPixelGirlSvg(100, true);
                const ducksCollected = this.ducks.filter(d => d.isCollected).length;
                setTimeout(() => {
                  document.getElementById("reward-tickets").textContent = ducksCollected * 2 + 5;
                  document.getElementById("victory-modal").style.display = "flex";
                }, 600);
              }
              break;
            }

            // Duck collection
            for (let d = 0; d < this.ducks.length; d++) {
              const duck = this.ducks[d];
              if (!duck.isCollected && (p.x - duck.x) ** 2 + (p.y - duck.y) ** 2 < 12) {
                duck.fillLevel += 0.25;
                if (duck.fillLevel >= 1) {
                  duck.isCollected = true;
                  audio.duck();
                  this.updateHUD();
                }
              }
            }

            // Collision with clouds / rocks
            const cell = grid[cy * W + cx];
            if (cell !== CELL_AIR) {
              p.vy *= -0.25;
              const dir = Math.random() > 0.5 ? 1 : -1;
              p.vx += dir * (0.9 + Math.random() * 0.9);
              const leftAir = cx > 0 && grid[cy * W + cx - 1] === CELL_AIR;
              const rightAir = cx < W - 1 && grid[cy * W + cx + 1] === CELL_AIR;
              if (leftAir && !rightAir) { p.x = cx - 0.15; p.vx = -1.3; }
              else if (rightAir && !leftAir) { p.x = cx + 1.15; p.vx = 1.3; }
              else p.y = Math.floor(p.y);
              break;
            } else {
              p.x = nextX;
              p.y = nextY;
            }
          }
        }

        // Crumb updates
        for (let i = this.crumbs.length - 1; i >= 0; i--) {
          const c = this.crumbs[i];
          c.x += c.vx;
          c.y += c.vy;
          c.life -= dt * 1.6;
          if (c.life <= 0) this.crumbs.splice(i, 1);
        }

        // RENDER SCREEN
        this.render(currentTime);
      }

      render(currentTime) {
        const ctx = this.ctx;
        const cw = this.canvas.width;
        const ch = this.canvas.height;
        const W = this.W;
        const H = this.H;
        const cs = this.cellSize;
        const grid = this.grid;

        // A. Procedural Sunset/Twilight Sky
        const skyGrad = ctx.createLinearGradient(0, 0, 0, ch);
        skyGrad.addColorStop(0, "#738be4");
        skyGrad.addColorStop(0.25, "#9ca6f5");
        skyGrad.addColorStop(0.52, "#cfaae9");
        skyGrad.addColorStop(0.78, "#f6c2d7");
        skyGrad.addColorStop(1, "#fde3cb");
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, cw, ch);

        // B. Golden Crescent Moon
        const moonX = cw * 0.85;
        const moonY = ch * 0.11;
        const moonR = Math.max(26, Math.min(42, cw * 0.026));
        const moonGlow = ctx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 2.8);
        moonGlow.addColorStop(0, "rgba(254, 240, 138, 0.45)");
        moonGlow.addColorStop(0.5, "rgba(253, 224, 71, 0.18)");
        moonGlow.addColorStop(1, "rgba(254, 240, 138, 0)");
        ctx.fillStyle = moonGlow;
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonR * 2.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonR, -Math.PI * 0.4, Math.PI * 0.9);
        ctx.arc(moonX - moonR * 0.45, moonY - moonR * 0.35, moonR * 0.88, Math.PI * 0.9, -Math.PI * 0.4, true);
        ctx.closePath();
        ctx.fill();

        // C. Twinkling Stars
        const timeSec = currentTime * 0.002;
        [
          [0.08, 0.06, 2.2], [0.18, 0.12, 1.6], [0.32, 0.07, 2.8], [0.46, 0.14, 1.8],
          [0.62, 0.08, 2.4], [0.74, 0.16, 2.0], [0.93, 0.08, 2.2], [0.12, 0.22, 1.8]
        ].forEach(([nx, ny, r], idx) => {
          const sx = nx * cw;
          const sy = ny * ch;
          const pulse = 0.5 + 0.5 * Math.sin(timeSec * 3.5 + idx * 1.8);
          ctx.fillStyle = "#ffffff";
          ctx.globalAlpha = 0.4 + 0.6 * pulse;
          ctx.beginPath();
          ctx.arc(sx, sy, r * (0.8 + 0.3 * pulse), 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // D. Distant Floating Castles
        ctx.save();
        ctx.fillStyle = "rgba(180, 150, 225, 0.28)";
        const castleBaseY = ch * 0.38;
        [
          { x: cw * 0.15, w: 28, h: 65, spireH: 30 },
          { x: cw * 0.22, w: 34, h: 80, spireH: 45 },
          { x: cw * 0.52, w: 42, h: 95, spireH: 55 },
          { x: cw * 0.72, w: 36, h: 85, spireH: 50 },
        ].forEach((c) => {
          ctx.fillRect(c.x, castleBaseY - c.h, c.w, c.h);
          ctx.beginPath();
          ctx.moveTo(c.x - 2, castleBaseY - c.h);
          ctx.lineTo(c.x + c.w / 2, castleBaseY - c.h - c.spireH);
          ctx.lineTo(c.x + c.w + 2, castleBaseY - c.h);
          ctx.closePath();
          ctx.fill();
        });
        ctx.restore();

        // E. Render Multi-colored Dreamy Clouds (White, Pink, Lavender, Peach)
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const type = grid[y * W + x];
            if (type === CELL_AIR) continue;
            const px = x * cs;
            const py = y * cs;

            if (isCloud(type)) {
              const topIsAir = y > 0 && grid[(y - 1) * W + x] === CELL_AIR;
              const bottomIsAir = y < H - 1 && grid[(y + 1) * W + x] === CELL_AIR;
              const leftIsAir = x > 0 && grid[y * W + x - 1] === CELL_AIR;
              const rightIsAir = x < W - 1 && grid[y * W + x + 1] === CELL_AIR;

              let bodyColor = "#fbf8ff";
              let topHighlight = "#ffffff";
              let shadowColor = "#d6c4eb";

              if (type === CELL_CLOUD_PINK) {
                bodyColor = (x + y) % 3 === 0 ? "#fce7f3" : "#fbcfe8";
                topHighlight = "#fff1f6";
                shadowColor = "#f472b6";
              } else if (type === CELL_CLOUD_LAVENDER) {
                bodyColor = (x + y) % 3 === 0 ? "#ede9fe" : "#ddd6fe";
                topHighlight = "#fcfaff";
                shadowColor = "#c4b5fd";
              } else if (type === CELL_CLOUD_PEACH) {
                bodyColor = (x + y) % 3 === 0 ? "#ffedd5" : "#fed7aa";
                topHighlight = "#fffbf5";
                shadowColor = "#fba875";
              } else {
                bodyColor = (x + y) % 4 === 0 ? "#ffffff" : "#f8f5fc";
                topHighlight = "#ffffff";
                shadowColor = "#cbb8e4";
              }

              ctx.fillStyle = bodyColor;
              ctx.fillRect(px, py, cs, cs);

              if (bottomIsAir || (y > 4 && (x + y) % 5 === 0)) {
                ctx.fillStyle = shadowColor;
                ctx.fillRect(px, py + cs - 2.5, cs, 2.5);
              }
              if (topIsAir) {
                ctx.fillStyle = topHighlight;
                ctx.fillRect(px, py, cs, 3);
                ctx.beginPath();
                ctx.arc(px + cs / 2, py + 1, cs / 2 + 1.2, Math.PI, 0);
                ctx.fill();
              }
              if (leftIsAir) {
                ctx.fillStyle = topHighlight;
                ctx.beginPath();
                ctx.arc(px + 1, py + cs / 2, cs / 2, Math.PI * 0.5, Math.PI * 1.5);
                ctx.fill();
              }
              if (rightIsAir) {
                ctx.fillStyle = bodyColor;
                ctx.beginPath();
                ctx.arc(px + cs - 1, py + cs / 2, cs / 2, -Math.PI * 0.5, Math.PI * 0.5);
                ctx.fill();
              }
            } else if (type === CELL_ROCK) {
              ctx.fillStyle = "#3e3260";
              ctx.fillRect(px, py, cs, cs);
              ctx.fillStyle = "#5c4a8a";
              ctx.fillRect(px + 1, py + 1, cs - 2, cs - 2);
              if ((x + y) % 4 === 0) {
                ctx.fillStyle = "#f59e0b";
                ctx.fillRect(px + 3, py + 3, 2, 2);
              }
            }
          }
        }

        // F. Celestial Star Ducks
        this.ducks.forEach(d => {
          ctx.save();
          ctx.translate(d.x * cs, d.y * cs);
          ctx.strokeStyle = "#fef08a";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(3, -11, 7, 2.5, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = d.isCollected ? "#fde047" : "#eab308";
          ctx.beginPath();
          ctx.ellipse(0, 2, 11, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(5, -4, 6.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.ellipse(-3, 1, 4.5, 3, -0.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#f97316";
          ctx.beginPath();
          ctx.ellipse(11, -3, 4, 2.2, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#1e1b4b";
          ctx.beginPath();
          ctx.arc(5, -5, 1.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // G. Celestial Starlight Water Stream
        this.particles.forEach(p => {
          const px = p.x * cs;
          const py = p.y * cs;
          ctx.fillStyle = "rgba(56, 189, 248, 0.38)";
          ctx.beginPath();
          ctx.arc(px, py, 5.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#38bdf8";
          ctx.beginPath();
          ctx.arc(px, py, 3.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.fillRect(px - 1.2, py - 1.2, 2.4, 2.4);
        });

        // H. Cloud Mist & Star Sparks
        this.crumbs.forEach(c => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, c.life / c.maxLife);
          if (c.isStar) {
            ctx.fillStyle = c.color;
            ctx.fillRect(c.x - c.radius * 1.6, c.y - 0.6, c.radius * 3.2, 1.2);
            ctx.fillRect(c.x - 0.6, c.y - c.radius * 1.6, 1.2, c.radius * 3.2);
          } else {
            ctx.fillStyle = c.color;
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });
      }
    }

    // Launch game on DOMContentLoaded or immediate
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => new GameEngine());
    } else {
      new GameEngine();
    }
  </script>
</body>
</html>
