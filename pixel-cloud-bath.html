<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dreamio · Pixel Cloud Bath</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e0b20;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      display: block;
    }
    /* Girl container overlay */
    #girl-container {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    #girl-container canvas { width: 100%; height: 100%; image-rendering: pixelated; }
    .girl-mood { position:absolute; inset:0; pointer-events:none; }
    .anger-mark { position:absolute; left:23%; top:41%; width:24px; height:24px; animation: angry-bob .65s steps(2,end) infinite; filter:drop-shadow(2px 2px 0 #fff4ef); }
    .mood-star { position:absolute; width:4px; height:14px; background:#fff3a3; box-shadow:0 0 8px #ffc7dc; animation: happy-twinkle 1.3s steps(3,end) infinite; }
    .mood-star::after { content:''; position:absolute; width:14px; height:4px; left:-5px; top:5px; background:#fff8c5; }
    @keyframes angry-bob { 0%,100% { transform:translateY(0) rotate(-6deg); } 50% { transform:translateY(-3px) rotate(6deg); } }
    @keyframes happy-twinkle { 0%,100% { opacity:.25; transform:translateY(2px) scale(.6); } 50% { opacity:1; transform:translateY(-5px) scale(1); } }
    @media (prefers-reduced-motion: reduce) { .anger-mark,.mood-star { animation:none; } }
    .bath-bubble { position:absolute; left:var(--x); top:var(--y); width:var(--size); height:var(--size); border:2px solid #fffaff; border-radius:35%; background:#d3f5ff55; box-shadow:inset 2px 2px #fff9,2px 2px #ddbbe755; animation:bubble-rise 3.5s linear infinite; animation-delay:var(--delay); opacity:0; }
    @keyframes bubble-rise { 0% { opacity:0; transform:translate(0,8px) scale(.6); } 20% { opacity:.9; } 80% { opacity:.7; } 100% { opacity:0; transform:translate(12px,-90px) scale(1.15); } }
    #bath-status { position:absolute; z-index:31; left:50%; top:76px; transform:translateX(-50%); display:none; align-items:center; gap:12px; max-width:94%; padding:8px 14px; background:#fff2f8ed; border:1px solid #d8a5c6; border-radius:16px; color:#8e577c; font-size:12px; box-shadow:0 5px 20px #a96b9433; }
    #bath-status button { background:#f4c4dc; border:1px solid #d09abf; border-radius:12px; padding:7px 12px; color:#82516e; cursor:pointer; white-space:nowrap; font-weight:bold; }
    @media(max-width:650px) { #bath-status { top:112px; font-size:10px; padding:6px 9px; gap:6px; } }
    @media(prefers-reduced-motion:reduce) { .bath-bubble { animation:none; opacity:.65; } }
    /* Floating HUD */
    .hud-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 30;
    }
    .hud-pill {
      background: rgba(23, 16, 50, 0.88);
      border: 1px solid rgba(165, 142, 225, 0.45);
      border-radius: 9999px;
      padding: 6px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .level-btn {
      background: rgba(40, 27, 80, 0.8);
      border: 1px solid rgba(165, 142, 225, 0.3);
      color: #ddd6fe;
      border-radius: 9999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }
    .level-btn:hover {
      background: #382670;
      color: #fff;
    }
    .level-btn.active {
      background: linear-gradient(to right, #fbbf24, #f59e0b);
      color: #1c1917;
      border-color: #fde047;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
      transform: scale(1.05);
    }
    .restart-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(30, 19, 61, 0.9);
      border: 2px solid #fbbf24;
      color: #fde047;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
      transition: transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .restart-btn:active {
      transform: scale(0.9);
    }
    /* Bottom Hint Bar */
    .bottom-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 17, 54, 0.85);
      border: 1px solid rgba(165, 142, 225, 0.35);
      border-radius: 9999px;
      padding: 6px 20px;
      font-size: 11px;
      font-weight: 700;
      color: #e0e7ff;
      pointer-events: none;
      z-index: 30;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    /* Victory Modal */
    #victory-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: linear-gradient(to bottom, #24184a, #1f1442, #160c33);
      border: 3px solid rgba(251, 191, 36, 0.85);
      border-radius: 24px;
      padding: 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 50px rgba(251, 191, 36, 0.45);
      color: #fff;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #fbbf24, #f59e0b, #ea580c);
      color: #1c1917;
      font-size: 14px;
      font-weight: 900;
      border: 2px solid #fde047;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.5);
      transition: transform 0.15s;
    }
    .modal-btn:hover {
      transform: scale(1.02);
    }
    .modal-btn:active {
      transform: scale(0.96);
    }
    .hud-pill { background:rgba(255,237,246,.94); border-color:#d7a4c3; color:#825779; box-shadow:0 5px 18px #b4789d30; }
    .hud-pill span, #level-name { color:#9b618a !important; }
    .level-btn { background:#f9dbea; color:#926084; border-color:#deb2ce; }
    .level-btn:hover { background:#f6c1dc; color:#754467; }
    .level-btn.active { background:linear-gradient(#fff5d3,#f9d6a9); color:#966b64; border-color:#fff8da; box-shadow:0 0 10px #ffcfce; }
    .restart-btn { background:#f8d6e9; border-color:#fff0bd; color:#9c6a8a; box-shadow:0 0 10px #e5b7d6; }
    .bottom-hint { background:rgba(255,235,245,.95); border-color:#deb2ce; color:#916480; }
    .modal-card { background:linear-gradient(#fff1f7,#f1daec); border-color:#f4c6d9; color:#885d80; box-shadow:0 0 50px #ffcadc80; }
    .modal-btn { background:linear-gradient(#ffe8b7,#f6bbd0); color:#885470; border-color:#fff4d4; }
    #stay-btn { color:#956b87 !important; }
    @media (max-width:650px) { .hud-bar { top:8px; left:8px; right:8px; flex-wrap:wrap; gap:7px; } .hud-pill { padding:5px 8px; gap:5px; font-size:10px; } #duck-icons { font-size:16px !important; } .bottom-hint { max-width:96%; font-size:9px; padding:6px 8px; white-space:normal; text-align:center; } }
    .episode-info { position:absolute; left:50%; top:63px; transform:translateX(-50%); max-width:94%; color:#8c6486; background:#fff4f9dc; border:1px solid #eac5dc; border-radius:10px; padding:5px 12px; font-size:10px; z-index:29; text-align:center; pointer-events:none; }
    #bath-status { top:105px; }
    #level-buttons { gap:3px; flex-wrap:wrap; }
    .hud-bar > div:first-child { flex-wrap:wrap; max-width:100%; }
    [data-theme="agent"] .hud-pill { background:#e3f5f0ed; color:#477e76; border-color:#86b4ae; }
    [data-theme="luxury"] .hud-pill { background:#fff2dced; color:#967149; border-color:#d5b782; }
    [data-theme="christmas"] .hud-pill { background:#f6fff2ed; color:#477767; border-color:#a2c6ac; }
    [data-theme="halloween"] .hud-pill { background:#f4def4ed; color:#86588c; border-color:#bb8fc4; }
    [data-theme="space"] .hud-pill { background:#eae2ffed; color:#7561a5; border-color:#aaa2d3; }
    @media(max-width:900px) { .hud-bar { flex-wrap:wrap; gap:7px; } .episode-info { top:112px; } #bath-status { top:151px; } .level-btn { padding:4px 8px; } }
    @media(max-width:450px) { .episode-info { top:151px; width:94%; font-size:9px; } #bath-status { top:204px; } .hud-bar > div:first-child { gap:5px !important; } .hud-bar #level-buttons { width:100%; justify-content:center; } .level-btn { padding:4px 7px; } }
    .score-hud { position:absolute; left:16px; bottom:48px; z-index:32; font-size:11px; }
    #score-floats { position:absolute; inset:0; pointer-events:none; z-index:34; }
    .score-pop { position:absolute; color:#b56b98; background:#fff5dfee; padding:4px 8px; border:1px solid #f3c4d9; border-radius:8px; font-weight:900; font-size:12px; animation:score-rise 1.6s ease-out forwards; }
    @keyframes score-rise { from { opacity:1; transform:translate(-50%,0); } to { opacity:0; transform:translate(-50%,-55px); } }
    #relay-controls { position:absolute; inset:0; pointer-events:none; z-index:28; }
    .relay-valve { position:absolute; transform:translate(-50%,-50%); pointer-events:auto; padding:4px 7px; font-size:10px; font-weight:800; border:1px solid #a59abe; border-radius:8px; background:#fff2e7f2; color:#87658f; cursor:pointer; }
    .relay-valve[aria-pressed="true"] { background:#dff4e8; color:#5a8279; }
    @media(max-width:450px) { .score-hud { left:8px; bottom:52px; padding:4px 7px; font-size:9px; } .relay-valve { font-size:9px; padding:3px 5px; } }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Fullscreen Interactive Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- The 1:1 Exact Pixel Girl sitting on top of the clouds in her tub -->
    <div id="girl-container"></div>

    <!-- Floating HUD -->
    <div class="hud-bar">
      <!-- Left: Title & Level Selector -->
      <div style="display: flex; align-items: center; gap: 8px; pointer-events: auto;">
        <div class="hud-pill" style="color: #fde047;">
          <span>🌙</span>
          <span id="level-name">Rose Palace · Cloud Castle</span>
        </div>
        <div class="hud-pill" id="level-buttons" style="padding: 4px 8px;">
          <!-- Generated via JS -->
        </div>
      </div>

      <!-- Center: 3 Star Ducks -->
      <div class="hud-pill" id="duck-icons" style="font-size: 22px; gap: 6px;">
        <span class="duck-star" style="opacity: 0.25;">🐥</span>
        <span class="duck-star" style="opacity: 0.25;">🐥</span>
        <span class="duck-star" style="opacity: 0.25;">🐥</span>
      </div>

      <!-- Right: Water Meter & Reset -->
      <div style="display: flex; align-items: center; gap: 10px; pointer-events: auto;">
        <div class="hud-pill">
          <span style="color: #67e8f9;">Bath water:</span>
          <div style="width: 90px; height: 16px; background: #f5d5e7; border: 1px solid rgba(103, 232, 249, 0.6); border-radius: 9999px; overflow: hidden; padding: 2px;">
            <div id="water-bar" style="width: 0%; height: 100%; background: linear-gradient(to right, #f3a8ce, #c8a4df); border-radius: 9999px; transition: width 0.15s; box-shadow: 0 0 8px #38bdf8;"></div>
          </div>
          <span id="water-pct" style="color: #a5f3fc; font-weight: 900;">0%</span>
        </div>
        <button class="restart-btn" id="restart-btn" title="Restart level">↺</button>
      </div>
    </div>

    <div class="score-hud hud-pill"><span id="score-value">Score 0</span><span id="water-quality">Fresh water</span></div>
    <div id="score-floats" aria-live="polite"></div>
    <div id="relay-controls" aria-label="Relay pool valves"></div>
    <div id="episode-info" class="episode-info"></div>
    <!-- Bottom Hint -->
    <div class="bottom-hint">
      Drag to dig · Tap relay valves · Collect gems & ducks · Avoid pollution
    </div>

    <div id="bath-status" role="status" aria-live="polite"><span id="bath-status-text"></span><button id="bath-action"></button></div>
    <!-- Victory Modal -->
    <div id="victory-modal">
      <div class="modal-card">
        <div style="font-size: 44px; margin-bottom: 8px;">✨ 🫧 ✨</div>
        <h3 style="font-size: 22px; font-weight: 900; color: #fde047; margin-bottom: 6px;">Bubble bath time!</h3>
        <p style="font-size: 12px; color: #ddd6fe; margin-bottom: 16px;">
          Fresh spring water has reached the bath. Relax and enjoy the bubbles!
        </p>
        <div id="modal-ducks" style="font-size: 34px; margin-bottom: 16px; background: rgba(17, 11, 40, 0.85); padding: 10px; border-radius: 16px; border: 1px solid rgba(165, 142, 225, 0.4);">
          🐥 🐥 🐥
        </div>
        <div style="background: rgba(45, 27, 84, 0.8); border: 1px solid rgba(165, 142, 225, 0.3); border-radius: 12px; padding: 10px; font-size: 12px; color: #fde047; font-weight: 800; margin-bottom: 18px;">
          🎟️ Arcade tickets: +<span id="reward-tickets">11</span> tickets!
        </div>
        <button class="modal-btn" id="next-level-btn">Next cloudscape →</button>
        <button id="stay-btn" style="background: none; border: none; color: #c4b5fd; font-size: 12px; font-weight: 700; margin-top: 12px; cursor: pointer;">Stay and enjoy the view</button>
      </div>
    </div>
  </div>

    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.lastDig = 0;
      }
      getCtx() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
        return this.ctx;
      }
      dig() {
        const now = performance.now();
        if (now - this.lastDig < 50) return;
        this.lastDig = now;
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        osc.type = "sine";
        osc.frequency.setValueAtTime(320 + Math.random() * 80, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.08);
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(450, ctx.currentTime);
        gain.gain.setValueAtTime(0.07, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      }
      splash() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(700 + Math.random() * 300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      }
      duck() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(380, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(560, ctx.currentTime + 0.08);
        osc.frequency.linearRampToValueAtTime(400, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      }

        const ctx = this.getCtx();
        if (!ctx) return;
        [440, 554.37, 659.25, 880, 1108.73].forEach((f, i) => {

          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.08);
          osc.stop(ctx.currentTime + i * 0.08 + 0.45);
        });

        window.addEventListener("resize", () => {

          if (!this.isPointerDown) return;
          const rect = this.canvas.getBoundingClientRect();

                const ny = gy + dy;
                if (nx >= 0 && nx < this.W && ny >= 0 && ny < this.H) {

                      let col = "#ffffff";
                      if (c === CELL_CLOUD_PINK) col = Math.random() > 0.5 ? "#fbcfe8" : "#f472b6";
                      else if (c === CELL_CLOUD_LAVENDER) col = Math.random() > 0.5 ? "#ede9fe" : "#c4b5fd";
                      else if (c === CELL_CLOUD_PEACH) col = Math.random() > 0.5 ? "#fed7aa" : "#fba875";

                      this.crumbs.push({
                        x: nx * this.cellSize + this.cellSize / 2,
                        y: ny * this.cellSize + this.cellSize / 2,
                        vx: (Math.random() - 0.5) * 2.2,
                        vy: -Math.random() * 1.8 - 0.3,
                        radius: isStar ? 2.5 : 4 + Math.random() * 5,
                        life: 1,
                        maxLife: 1,
                        color: isStar ? "#fef08a" : col,
                        isStar
                      });
                    }
                  }
                }
              }
            }
          }
          if (dug) { this.cloudLayerDirty = true; audio.dig(); }
        };

        this.canvas.addEventListener("pointerdown", (e) => {
          const rect = this.canvas.getBoundingClientRect();
          if (this.collectNearby(e.clientX-rect.left,e.clientY-rect.top,13)) {
            this.isPointerDown = false; return;
          }
          if (this.sparkTreasure(e.clientX - rect.left, e.clientY - rect.top)) {
            this.isPointerDown = false;
            return;
          }
          this.isPointerDown = true;
          this.canvas.setPointerCapture(e.pointerId);
          dig(e);
        });
        this.canvas.addEventListener("pointermove", dig);
        this.canvas.addEventListener("pointerup", () => { this.isPointerDown = false; });
        this.canvas.addEventListener("pointercancel", () => { this.isPointerDown = false; });

        document.getElementById("restart-btn").addEventListener("click", () => {
          this.initLevel(this.currentLevelIdx);
        });
        document.getElementById("next-level-btn").addEventListener("click", () => {
          document.getElementById("victory-modal").style.display = "none";
          this.initLevel((this.currentLevelIdx + 1) % LEVELS.length);
        });
        document.getElementById("bath-action").addEventListener("click", () => {
          if (this.isDirty) this.initLevel(this.currentLevelIdx);
          else if (this.isCompleted) this.initLevel((this.currentLevelIdx + 1) % LEVELS.length);
        });
        document.getElementById("stay-btn").addEventListener("click", () => {
          document.getElementById("victory-modal").style.display = "none";
        });
      }

      resize() {
        const bounds = document.getElementById("game-container").getBoundingClientRect();
        this.canvas.width = Math.round(bounds.width);
        this.canvas.height = Math.round(bounds.height);
        // Keep the entire simulation inside the visible viewport on small screens.
        this.cellSize = Math.min(12, this.canvas.width / 40, this.canvas.height / 30);
        this.W = Math.floor(this.canvas.width / this.cellSize);
        this.H = Math.floor(this.canvas.height / this.cellSize);
        this.cloudTexture = null;
        this.scene.width = Math.ceil(this.canvas.width / 2);
        this.scene.height = Math.ceil(this.canvas.height / 2);
      }

      initLevel(idx) {
        this.currentLevelIdx = idx;
        const lvl = LEVELS[idx];
        document.getElementById('game-container').dataset.theme = lvl.theme;
        document.getElementById('episode-info').textContent = lvl.briefing
          ? `Difficulty ${lvl.difficulty}/8 · Drops ${lvl.spawners.reduce((n,s)=>n+s.count,0)} / Goal ${lvl.tubRatio.targetWater} · ${lvl.briefing}`
          : 'Beginner · Dig a clean route from the spring to the bath';
        // Palette and terrain caches must follow the selected episode.
        this.cloudTexture = null;
        document.getElementById("level-name").textContent = lvl.name;
        document.getElementById("victory-modal").style.display = "none";

        // Build Level Switcher buttons
        const btnBox = document.getElementById("level-buttons");
        btnBox.innerHTML = "";
        LEVELS.forEach((l, i) => {
          const b = document.createElement("button");
          b.className = `level-btn ${i === idx ? "active" : ""}`;
          b.textContent = l.number;
          b.onclick = () => this.initLevel(i);
          btnBox.appendChild(b);
        });

        const W = this.W;
        const H = this.H;
        this.grid = new Uint8Array(W * H);
        this.isDirty = false;
        document.getElementById('water-bar').style.background = 'linear-gradient(to right,#f3a8ce,#c8a4df)';
        this.hazardRadius = Math.min(13, this.canvas.width / 35);
        this.hazards = lvl.hazards.map(([x,y,type]) => ({x:x*this.canvas.width, y:y*this.canvas.height, type, triggered:false}));
        this.backgroundLayer = null;
        document.getElementById('bath-status').style.display = 'none';
        this.cloudLayerDirty = true;
        this.waterCollected = 0;
        this.waterPercent = 0;
        this.isCompleted = false;
        this.crumbs = [];
        this.updateHUD();

        // Lay out the sprite and its real intake together, respecting the visible HUD.
        const [spotX, spotY] = BATH_SPOTS[idx];
        const girlWidth = Math.min(220, this.canvas.width * .42, this.canvas.height * .30);
        const svgScale = girlWidth / 100, girlHeight = girlWidth * 1.25;
        const tubW = Math.max(3, Math.round(80 * svgScale / this.cellSize));
        const tubH = Math.max(2, Math.ceil(36 * svgScale / this.cellSize));
        const centerX = Math.max(girlWidth/2+8, Math.min(this.canvas.width-girlWidth/2-8,spotX*this.canvas.width));
        const hudBottom = this.canvas.width <= 450 ? 202 : this.canvas.width <= 900 ? 152 : 108;
        const intakeY = Math.max(hudBottom + 74*svgScale, Math.min(this.canvas.height-58-49*svgScale,spotY*this.canvas.height));
        const tubX = centerX/this.cellSize-tubW/2;
        const tubY = Math.floor(intakeY/this.cellSize);
        this.tub = {x:tubX,y:tubY,w:tubW,h:tubH,target:lvl.tubRatio.targetWater};
        this.girlContainer.style.left = `${centerX-girlWidth/2}px`;
        this.girlContainer.style.top = `${tubY*this.cellSize-74*svgScale}px`;
        this.girlContainer.style.width = `${girlWidth}px`;
        this.girlContainer.style.height = `${girlHeight}px`;
        this.score = 0; this.sparkleFrames = 0; this.collectedGems = new Set();
        this.reservoirs = []; this.gateRows = [];
        document.getElementById('score-floats').innerHTML = '';
        this.updateGirl(0,false);
        this.levelHeightScale = 1;

        // Generate Clouds Ocean (Filling the lower screen!)
        const startY = Math.floor(H * 0.27);
        for (let y = startY; y < H - 1; y++) {
          for (let x = Math.max(2, Math.floor(W * .12)); x < Math.min(W - 2, Math.ceil(W * .88)); x++) {
            if (y < startY + 1.7 + 1.6 * Math.sin(x * 0.38) + 0.7 * Math.cos(x * 0.71)) continue;
            const noise = Math.sin(x * 0.18) * Math.cos(y * 0.15) + Math.sin((x + y) * 0.12);
            if (noise > 0.5) this.grid[y * W + x] = CELL_CLOUD_PINK;
            else if (noise > 0.1) this.grid[y * W + x] = CELL_CLOUD_WHITE;
            else if (noise > -0.3) this.grid[y * W + x] = CELL_CLOUD_LAVENDER;
            else this.grid[y * W + x] = CELL_CLOUD_PEACH;
          }
        }

        // Borders
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (x < 2 || x >= W - 2 || y >= H - 1) this.grid[y * W + x] = CELL_ROCK;
          }
        }

        // Solid cloud foundation directly beneath the tub
        for (let y = tubY + tubH; y < H - 1; y++) {
          for (let x = Math.max(2, Math.floor(tubX) - 4); x < Math.min(W - 2, Math.ceil(tubX + tubW) + 4); x++) {
            this.grid[y * W + x] = CELL_CLOUD_WHITE;
          }
        }
        // Air pocket inside tub intake
        for (let y = Math.max(0, tubY - 1); y < Math.min(H - 1, tubY + tubH); y++) {
          for (let x = Math.floor(tubX); x < Math.ceil(tubX + tubW); x++) {
            this.grid[y * W + x] = CELL_AIR;
          }
        }

        this.buildRelayLayout(lvl);

        // Celestial Star Ducks
        this.ducks = lvl.ducks.map((d,i) => ({
          x: Math.round(this.routePoint(.24+i*.27).x + (i%2 ? 1 : -1)*2),
          y: Math.round(this.routePoint(.24+i*.27).y),
          isCollected: false,
          fillLevel: 0
        }));
        this.ducks.forEach(d => {
          for (let dy = -3; dy <= 3; dy++) {
            for (let dx = -3; dx <= 3; dx++) {
              if (dx*dx+dy*dy<=9 && d.x+dx>=0 && d.x+dx<W && d.y+dy>=0 && d.y+dy<H && isCloud(this.grid[(d.y+dy)*W+d.x+dx])) this.grid[(d.y+dy)*W+d.x+dx]=CELL_AIR;
            }
          }
        });

        // Spawn Water Particles
        this.particles = [];
        lvl.spawners.forEach(s => {
          const sx = this.source.x;
          const sy = this.source.y;
          for (let i = 0; i < s.count; i++) {
            this.particles.push({
              x: sx + (Math.random() - 0.5) * 5,
              y: sy + (Math.random() - 0.5) * 2,
              vx: (Math.random() - 0.5) * 0.4,
              vy: Math.random() * 0.2
            });
          }
        });
        this.updateHUD();
      }

      routePoint(t) {
        const y=this.source.y+(this.tub.y-this.source.y)*t;
        const points=[this.source,...this.reservoirs.flatMap(r=>[{x:r.x,y:r.y},{x:r.x,y:r.y+3.1}]),{x:this.tub.x+this.tub.w/2,y:this.tub.y}];
        for(let i=1;i<points.length;i++) {
          if(y<=points[i].y){const a=points[i-1],b=points[i],f=(y-a.y)/Math.max(.1,b.y-a.y);return {x:a.x+(b.x-a.x)*f,y};}
        }
        return points[points.length-1];
      }

      buildRelayLayout(lvl) {
        const cs=this.cellSize,W=this.W,H=this.H;
        const hudBottom=this.canvas.width<=450?202:this.canvas.width<=900?152:108;
        this.source={x:W*.5,y:Math.max(H*.08,(hudBottom+6)/cs)};
        const span=this.tub.y-this.source.y;
        const count=this.currentLevelIdx>=3 && span>=22 ? 2 : 1;
        const targetX=this.tub.x+this.tub.w/2;
        this.reservoirs=Array.from({length:count},(_,i)=>({id:i,x:i===0?this.source.x:targetX,
          y:Math.floor(this.source.y+span*(i===0?.25:.61)),half:Math.max(2,Math.min(4,Math.floor(W*.075))),stored:[],opened:false}));
        const set=(x,y,type)=>{if(x>=2&&x<W-2&&y>=0&&y<H-1)this.grid[y*W+x]=type;};
        this.reservoirs.forEach(r=>{
          r.x=Math.round(r.x);
          for(let y=r.y;y<=r.y+2;y++)for(let x=r.x-r.half-1;x<=r.x+r.half+1;x++){
            set(x,y,y===r.y+2||x===r.x-r.half-1||x===r.x+r.half+1?CELL_ROCK:CELL_AIR);
          }
        });
        // A diggable plug holds the initial source. Relay valves never teleport water.
        const sy=Math.floor(this.source.y)+2;
        if(this.reservoirs[0].y>sy+2) for(let x=Math.floor(this.source.x)-5;x<=Math.ceil(this.source.x)+5;x++)set(x,sy,Math.abs(x-this.source.x)<=3?CELL_CLOUD_PINK:CELL_ROCK);
        const route=[this.source,...this.reservoirs.flatMap(r=>[{x:r.x,y:r.y},{x:r.x,y:r.y+3.1}]),{x:targetX,y:this.tub.y+1}];
        const distance=(x,y)=>{
          let best=Infinity;
          for(let j=1;j<route.length;j++){
            const a=route[j-1],b=route[j],dx=b.x-a.x,dy=b.y-a.y;
            const t=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy||1)));
            best=Math.min(best,Math.hypot(x-a.x-dx*t,y-a.y-dy*t));
          }
          return best;
        };
        const placed=[];
        this.hazards.forEach((q,i)=>{
          const p=this.routePoint(.35+i/Math.max(1,this.hazards.length-1)*.43);
          const margin=(lvl.digRadius||3.6)+this.hazardRadius/cs+2;
          const preferred=p.x+(i%2?-1:1)*W*.26;
          let pick=null,cost=Infinity;
          for(let x=3;x<W-3;x++)for(let dy=-2;dy<=2;dy++){
            const y=p.y+dy;
            if(y<this.source.y||distance(x,y)<margin||placed.some(h=>Math.hypot(x-h.x,y-h.y)<3))continue;
            const c=Math.abs(x-preferred)+Math.abs(dy)*3;
            if(c<cost){pick={x,y};cost=c;}
          }
          // Compact landscape screens may have no room beside a steep chute.
          // Put any extra traps below the bath rather than block the only route.
          if(!pick)pick={x:Math.max(3,Math.min(W-4,preferred)),y:Math.min(H-3,this.tub.y+5+i)};
          q.x=pick.x*cs;q.y=pick.y*cs;placed.push(pick);
        });
        (lvl.gates||[]).forEach((g,i,arr)=>{
          const p=this.routePoint(.36+i/Math.max(1,arr.length-1)*.43),y=Math.floor(p.y);
          if(this.reservoirs.some(r=>Math.abs(y-r.y)<4))return;
          const half=Math.max(3,Math.round(W*g.width/2));
          for(let x=2;x<W-2;x++)if(Math.abs(x-p.x)>half)set(x,y,CELL_ROCK);
          this.gateRows.push({y0:y,y1:y+1,center:p.x});
        });
        const controls=document.getElementById('relay-controls');controls.innerHTML='';
        this.reservoirs.forEach(r=>{
          const button=document.createElement('button');button.className='relay-valve';
          button.style.left=`${r.x*cs}px`;button.style.top=`${(r.y+3)*cs}px`;
          button.addEventListener('click',()=>{r.opened=!r.opened;this.refreshRelay(r);});
          controls.appendChild(button);r.button=button;this.refreshRelay(r);
        });
      }

      refreshRelay(r) {
        if(!r.button)return;
        r.button.textContent=`Pool ${r.id+1}: ${r.stored.length} · ${r.opened?'Close':'Release'}`;
        r.button.setAttribute('aria-pressed',String(r.opened));
        r.button.setAttribute('aria-label',`${r.opened?'Close':'Open'} relay pool ${r.id+1}, ${r.stored.length} stored drops`);
      }

      advanceRelays() {
        this.reservoirs.forEach((r,i)=>{
          if(!r.opened||!r.stored.length)return;
          const target=this.reservoirs[i+1]||{x:this.tub.x+this.tub.w/2,y:this.tub.y+1};
          for(let n=0;n<2&&r.stored.length;n++){
            const saved=r.stored.shift();
            this.particles.push({x:r.x+(Math.random()-.5)*.4,y:r.y+3.1,vx:0,vy:3,
              routeTarget:{x:target.x,y:target.y+.3},lastRelay:r.id,star:saved.star});
          }
          this.refreshRelay(r);
        });
      }

      renderRelays(ctx,time) {
        const cs=this.cellSize;
        this.reservoirs.forEach((r,i)=>{
          const next=this.reservoirs[i+1]||{x:this.tub.x+this.tub.w/2,y:this.tub.y};
          const x0=r.x*cs,y0=(r.y+3)*cs,x1=next.x*cs,y1=next.y*cs;
          ctx.fillStyle='#a6d8e9';ctx.globalAlpha=.7;
          for(let t=0;t<1;t+=.055)ctx.fillRect(Math.round(x0+(x1-x0)*t)-1,Math.round(y0+(y1-y0)*t),3,2);
          ctx.globalAlpha=1;
          const x=(r.x-r.half)*cs,y=r.y*cs,ww=(r.half*2+1)*cs;
          ctx.fillStyle='#d8d1ed';ctx.fillRect(x-3,y-2,ww+6,cs*2+5);
          ctx.fillStyle='#f9f6ff';ctx.fillRect(x,y,ww,cs*2);
          const height=Math.min(cs*1.65,r.stored.length/Math.max(1,this.tub.target)*cs*1.65);
          ctx.fillStyle=this.isDirty?'#aaa172':r.stored.some(p=>p.star)?'#f5df99':'#8ed6e6';
          ctx.fillRect(x+2,y+cs*2-height,ww-4,height);
          ctx.fillStyle='#fff';ctx.fillRect(x+4,y+cs*2-height,Math.min(12,ww-8),2);
        });
      }

      scoreBurst(x,y,points,label) {
        this.score+=points;
        this.sparkleFrames=600;
        if(!this.isDirty){this.particles.forEach(p=>p.star=true);this.reservoirs.forEach(r=>r.stored.forEach(p=>p.star=true));}
        for(let j=0;j<24;j++){
          const angle=j*Math.PI*2/24,speed=.7+Math.random()*2.3;
          this.crumbs.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-.6,radius:2+Math.random()*3,
            life:2.4,maxLife:2.4,color:['#fff1a9','#fff','#f3aed1','#d9c4ff'][j%4],isStar:true});
        }
        const pop=document.createElement('span');pop.className='score-pop';pop.textContent=`+${points} ${label} · ${this.isDirty?'Pollution remains':'STAR WATER ×2'}`;
        pop.style.left=`${Math.max(70,Math.min(this.canvas.width-70,x))}px`;pop.style.top=`${y}px`;
        pop.addEventListener('animationend',()=>pop.remove());document.getElementById('score-floats').appendChild(pop);
        this.updateHUD();audio.duck();
      }

      collectDuck(d) {
        if(d.isCollected)return false;
        d.isCollected=true;d.fillLevel=1;this.scoreBurst(d.x*this.cellSize,d.y*this.cellSize,150,'Duck');return true;
      }

      collectNearby(px,py,radius) {
        let found=false;
        this.ducks.forEach(d=>{if(!d.isCollected&&Math.hypot(px-d.x*this.cellSize,py-d.y*this.cellSize)<=radius+10){this.collectDuck(d);found=true;}});
        TREASURE_POSITIONS.forEach(([nx,ny],i)=>{
          if((i%5!==1 && i%5!==2)||this.collectedGems.has(i))return;
          const x=nx*this.canvas.width,y=ny*this.canvas.height;
          if(!isCloud(this.grid[Math.floor(y/this.cellSize)*this.W+Math.floor(x/this.cellSize)]))return;
          if(Math.hypot(px-x,py-y)<=radius+10){this.collectedGems.add(i);this.scoreBurst(x,y,i%5===2?150:100,i%5===2?'Duck':'Diamond');found=true;}
        });
        return found;
      }

      updateHUD() {
        document.getElementById('score-value').textContent = `Score ${this.score || 0}`;
        document.getElementById('water-quality').textContent = this.isDirty ? 'Polluted water' : this.sparkleFrames > 0 ? 'Star water ×2' : 'Fresh water';
        document.getElementById("water-bar").style.width = `${this.waterPercent}%`;
        document.getElementById("water-pct").textContent = `${this.waterPercent}%`;
        const duckEls = document.querySelectorAll(".duck-star");
        this.ducks.forEach((d, i) => {
          if (duckEls[i]) {
            duckEls[i].style.opacity = d.isCollected ? "1" : "0.25";
            duckEls[i].style.transform = d.isCollected ? "scale(1.15)" : "scale(1)";
          }
        });
      }

      loop(currentTime) {
        requestAnimationFrame((t) => this.loop(t));
        const dt = 0.016;
        const W = this.W;
        const H = this.H;
        const grid = this.grid;
        const particles = this.particles;

        if(this.sparkleFrames>0) { this.sparkleFrames--; if(!this.sparkleFrames)this.updateHUD(); }
        this.advanceRelays();
        // Physics Update
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.vy += 13.5 * dt;
          if(p.routeTarget && p.y < p.routeTarget.y) {
            const dx=p.routeTarget.x-p.x,dy=p.routeTarget.y-p.y;
            // Enchanted glass chutes guide water sideways, always downhill.
            p.vx=Math.max(-120,Math.min(120,dx/Math.max(dy,.25)*Math.max(3,p.vy)));
          }
          if(this.sparkleFrames>0 && !this.isDirty) p.star=true;
          p.vx *= 0.985;
          p.vy = Math.min(p.vy, 15);

          const steps = 2;
          const subDt = dt / steps;
          for (let s = 0; s < steps; s++) {
            const nextX = p.x + p.vx * subDt;
            const nextY = p.y + p.vy * subDt;
            const cx = Math.floor(nextX);
            const cy = Math.floor(nextY);

            if (cx < 0 || cx >= W || cy >= H) {
              particles.splice(i, 1);
              break;
            }

            const relay=this.reservoirs.find(r=>cx>=r.x-r.half && cx<=r.x+r.half && cy>=r.y && cy<r.y+2 && p.lastRelay!==r.id);
            if(relay) {
              relay.stored.push({star:!!p.star});particles.splice(i,1);this.refreshRelay(relay);break;
            }

            // Tub collection
            if (cx >= this.tub.x && cx < this.tub.x + this.tub.w && cy >= this.tub.y && cy < this.tub.y + this.tub.h) {
              particles.splice(i, 1);
              this.waterCollected += p.star && !this.isDirty ? 2 : 1;
              audio.splash();
              this.waterPercent = Math.min(100, Math.round((this.waterCollected / this.tub.target) * 100));
              this.updateHUD();
              this.updateGirl(this.waterPercent, this.isCompleted);

              if (this.waterCollected >= this.tub.target && !this.isCompleted && !this.isDirty) {
                this.isCompleted = true;
                if (window.parent !== window && new URLSearchParams(window.location.search).get("arcade") === "1") {
                  window.parent.postMessage({ type: "dreamio:cloud-bath-complete" }, window.location.origin);
                }
                audio.victory();
                this.updateGirl(100, true);
                this.updateBathStatus();
              }
              break;
            }

            // Duck collection
            for (let d = 0; d < this.ducks.length; d++) {
              const duck = this.ducks[d];
              if (!duck.isCollected && (p.x - duck.x) ** 2 + (p.y - duck.y) ** 2 < 12) {
                duck.fillLevel += 0.25;
                if (duck.fillLevel >= 1) {
                  this.collectDuck(duck);
                }
              }
            }

            // Collision with clouds / rocks
            const cell = grid[cy * W + cx];
            if (cell !== CELL_AIR) {
              p.vy *= -0.25;
              const dir = Math.random() > 0.5 ? 1 : -1;
              const guide = cell === CELL_ROCK && this.gateRows.find(g => cy >= g.y0 && cy < g.y1);
              // Gently sloped baffles carry resting water toward their opening.
              if (guide) p.vx = Math.sign(guide.center - cx) * 2.6;
              else p.vx += dir * (0.9 + Math.random() * 0.9);
              const leftAir = cx > 0 && grid[cy * W + cx - 1] === CELL_AIR;
              const rightAir = cx < W - 1 && grid[cy * W + cx + 1] === CELL_AIR;
              if (leftAir && !rightAir) { p.x = cx - 0.15; p.vx = -1.3; }
              else if (rightAir && !leftAir) { p.x = cx + 1.15; p.vx = 1.3; }
              else p.y = Math.floor(p.y);
              break;
            } else {
              p.x = nextX;

        if (key === this.girlStateKey) return;
        this.girlStateKey = key;
        const svg = renderPixelGirlSvg(water, happy, this.isDirty, LEVELS[this.currentLevelIdx].theme);
        this.girlContainer.dataset.mood = happy ? 'happy' : 'angry';
        this.girlContainer.setAttribute('aria-label', this.isDirty ? 'Dirty water! The girl is upset. Restart and avoid pollution.' : happy ? 'A happy girl enjoying her bath beneath twinkling stars.' : 'The girl is waiting, frowning beneath a red anger mark.');
        // Rasterize at one SVG unit per pixel, keeping the porcelain mosaic crisp.
        // The SVG remains visible while the local data image is decoding.
        this.girlContainer.innerHTML = svg;
        const mood = document.createElement('div');
        mood.className = 'girl-mood';
        mood.setAttribute('aria-hidden', 'true');
        mood.innerHTML = happy
          ? [[12,43],[23,34],[35,40],[43,32],[54,43],[8,53],[39,51]].map(([x,y], i) => `<span class="mood-star" style="left:${x}%;top:${y}%;animation-delay:-${i*.19}s"></span>`).join('')
          : '<svg class="anger-mark" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M2 1v4h4v2H0V1zM10 1h2v4h4v2h-6zM0 10h6v6H4v-4H0zM10 10h6v2h-4v4h-2z" fill="#eb4e73"/></svg>';
        if (happy) {
          mood.innerHTML += Array.from({length:10}, (_,i) => `<span class="bath-bubble" style="--x:${24+(i*17)%49}%;--y:${57+(i*7)%20}%;--size:${7+(i%4)*3}px;--delay:-${i*.37}s"></span>`).join('');
        }
        this.girlContainer.appendChild(mood);
        const version = this.girlVersion = (this.girlVersion || 0) + 1;
        const img = new Image();
        img.onload = () => {
          if (version !== this.girlVersion) return;
          const sprite = document.createElement('canvas');
          sprite.width = 100; sprite.height = 125;
          sprite.setAttribute('aria-hidden', 'true');
          sprite.getContext('2d').drawImage(img, 0, 0, 100, 125);
          this.girlContainer.querySelector('svg')?.replaceWith(sprite);
        };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('width:100%;height:100%;', 'width:100px;height:125px;'));
      }

      sparkTreasure(px, py) {
        if (this.hazards.some(h => !h.triggered && Math.hypot(px-h.x, py-h.y) <= this.hazardRadius+4)) return false;
        const cw = this.canvas.width, ch = this.canvas.height;
        const scale = Math.min(1.1, cw / 700 + .35);
        for (let i = 0; i < TREASURE_POSITIONS.length; i++) {
          if(this.collectedGems.has(i)) continue;
          const [nx, ny] = TREASURE_POSITIONS[i];
          const x = Math.round(nx * cw);
          const bob = this.reduceMotion ? 0 : Math.round(Math.sin((this.renderTime || 0) / 1100 + i) * 2);
          const y = Math.round(ny * ch) + bob * scale;
          const cell = Math.floor(ny * ch / this.cellSize) * this.W + Math.floor(x / this.cellSize);
          if (!isCloud(this.grid[cell]) || Math.abs(px - x) > 17 * scale + 4 || Math.abs(py - y) > 17 * scale + 4) continue;
          for (let j = 0; j < 22; j++) {
            const angle = j * Math.PI * 2 / 22;
            const speed = .7 + Math.random() * 2.3;
            this.crumbs.push({x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-.5,
              radius:2+Math.random()*3, life:2.6, maxLife:2.6,
              color:['#fff5ac','#ffffff','#ffb6db','#e4c6ff'][j%4], isStar:true});
          }
          audio.duck();
          return true;
        }
        return false;
      }

      renderClouds(ctx, time) {
        const cw = this.canvas.width, ch = this.canvas.height;
        if (!this.cloudTexture) {
          const texture = document.createElement('canvas');
          const pixel = 2;
          texture.width = Math.ceil(cw / pixel);
          texture.height = Math.ceil(ch / pixel);
          const tc = texture.getContext('2d');
          // Overlapping round lobes, quantized into soft pixel-art shade bands.
          const shades = ({agent:['#f3fff8','#e4f4ed','#d0e9e0','#bcdad6','#a8cbc9','#95b8bf','#8ba7b6'],luxury:['#fffdf1','#fff2df','#f9e5d1','#ecd4c6','#dfbed0','#cfb2c8','#bba5c0'],christmas:['#fffef9','#f3faf8','#e6f1ee','#d9e7e8','#c7d9e1','#b5c9d7','#a7b7ce'],halloween:['#fff1ed','#f4dfed','#e5cde4','#d0b5d9','#b99cc8','#a089ba','#8e79a8'],space:['#fff5ff','#ece6ff','#dad7f5','#c5c3e6','#b0afd5','#999bc6','#8589b4']})[LEVELS[this.currentLevelIdx].theme] || ['#fffaf4','#fff0f4','#fce4ef','#f2d2e6','#e9c6df','#d9c3e2','#c6bfdc'];
          for (let y = 0; y < texture.height; y++) {
            for (let x = 0; x < texture.width; x++) {
              const px = x * pixel, py = y * pixel;
              const row = Math.floor(py / 63);
              let best = -Infinity, shade = 0;
              for (let r = row - 1; r <= row + 1; r++) {
                const offset = (r % 2) * 46;
                const col = Math.round((px - offset) / 94);
                for (let c = col - 1; c <= col + 1; c++) {
                  const cx = c * 94 + offset + Math.sin(r * 4 + c) * 9;
                  const cy = r * 63 + Math.cos(c * 3 + r) * 10;
                  const dx = (px - cx) / 61, dy = (py - cy) / 47;
                  const depth = 1 - dx * dx - dy * dy;
                  if (depth > best) {
                    best = depth;
                    const light = Math.sqrt(Math.max(0, depth)) * 0.64 - dx * 0.23 - dy * 0.37;
                    shade = Math.max(0, Math.min(6, Math.floor((0.95 - light) * 6)));
                  }
                }
              }
              const grain = ((x * 17 + y * 31) % 37);
              if (grain === 0 && shade > 0) shade--;
              if (grain === 1 && shade < 6) shade++;
              tc.fillStyle = shades[shade];
              tc.fillRect(x, y, 1, 1);
            }
          }
          this.cloudTexture = texture;
        }
        if (this.cloudLayerDirty || !this.cloudLayer) {
          const layer = this.cloudMask || document.createElement('canvas');
          layer.width = cw; layer.height = ch;
          const lc = layer.getContext('2d');
          lc.fillStyle = '#fff';
          for (let y = 0; y < this.H; y++) {
            for (let x = 0; x < this.W; x++) {
              if (isCloud(this.grid[y * this.W + x])) lc.fillRect(x * this.cellSize, y * this.cellSize, this.cellSize + .4, this.cellSize + .4);
            }
          }
          this.cloudMask = layer;
          this.cloudLayer = document.createElement("canvas");
          this.cloudLayer.width = cw; this.cloudLayer.height = ch;
          this.cloudLayerDirty = false;
        }
        const lc = this.cloudLayer.getContext('2d');
        lc.clearRect(0, 0, cw, ch);
        lc.drawImage(this.cloudMask, 0, 0);
        lc.globalCompositeOperation = 'source-in';
        lc.imageSmoothingEnabled = false;
        const driftX = this.reduceMotion ? 0 : Math.round(Math.sin(time / 2400) * 5);
        const driftY = this.reduceMotion ? 0 : Math.round(Math.cos(time / 3100) * 3);
        lc.drawImage(this.cloudTexture, driftX - 8, driftY - 8, cw + 16, ch + 16);
        lc.globalCompositeOperation = 'source-over';
        ctx.drawImage(this.cloudLayer, 0, 0);
      }

      renderTreasures(ctx, time) {
        const cw = this.canvas.width, ch = this.canvas.height;
        const positions = TREASURE_POSITIONS;
        positions.forEach(([nx, ny], i) => {
          if(this.collectedGems.has(i)) return;
          const x = Math.round(nx * cw), y = Math.round(ny * ch);
          // Buried ornaments disappear when their cloud is dug away.
          const gx = Math.floor(x / this.cellSize), gy = Math.floor(y / this.cellSize);
          if (!isCloud(this.grid[gy * this.W + gx])) return;
          ctx.save();
          ctx.translate(x, y);
          const size = Math.min(1.1, cw / 700 + .35);
          ctx.scale(size, size);
          ctx.translate(0, (this.reduceMotion ? 0 : Math.round(Math.sin(time / 1100 + i) * 2)));
          const rect = (color, x, y, w, h) => { ctx.fillStyle = color; ctx.fillRect(x,y,w,h); };
          const theme = LEVELS[this.currentLevelIdx].theme;
          if (theme === 'christmas' && i % 5 === 0) {
            rect('#be6b85',-12,-7,24,19);rect('#e79eb5',-13,-10,26,6);
            rect('#fff0c4',-2,-10,4,22);rect('#fff0c4',-12,-1,24,3);
            rect('#fff0c4',-8,-15,7,5);rect('#fff0c4',2,-15,7,5);
          } else if (theme === 'halloween' && i % 5 === 0) {
            rect('#bd827f',-12,-6,24,17);rect('#f2b485',-9,-9,18,23);
            rect('#8c987f',-2,-15,5,7);rect('#ffe0a0',-7,-3,4,4);rect('#ffe0a0',4,-3,4,4);
            rect('#805f85',-6,6,13,3);rect('#f9d19b',-4,7,3,2);
          } else if (i % 5 === 0) {
            // A little turquoise treasure chest with brass fittings.
            rect('#b286ab',-12,-7,24,18); rect('#d59ac0',-10,-9,20,8);
            rect('#ffe0ed',-8,-9,16,3); rect('#f6d895',-12,0,24,3);
            rect('#f9e4a4',-9,-7,3,17); rect('#f9e4a4',6,-7,3,17);
            rect('#a17d58',-2,-1,5,6); rect('#fff0b6',-1,0,3,3);
          } else if (i % 5 === 1) {
            // Faceted candy-colored diamonds.
            const pink = i % 2;
            ctx.beginPath(); ctx.moveTo(-11,-4); ctx.lineTo(-5,-11); ctx.lineTo(6,-11); ctx.lineTo(12,-4); ctx.lineTo(0,13); ctx.closePath();
            ctx.fillStyle = pink ? '#d9a7e3' : '#db96c6'; ctx.fill();
            ctx.strokeStyle = '#8587ae'; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-11,-4); ctx.lineTo(0,13); ctx.lineTo(-3,-4); ctx.lineTo(3,-11); ctx.closePath(); ctx.fillStyle = pink ? '#f6d9ee' : '#ffe2f7'; ctx.fill();
            rect('#fffaf4',-3,-9,5,3);
          } else if (i % 5 === 2) {
            rect('#e1ad59',-10,0,18,8); rect('#ffe893',-10,-3,16,8);
            rect('#ffe893',2,-11,9,11); rect('#fff3b4',3,-11,6,3);
            rect('#ebac6c',11,-5,5,3); rect('#66607d',7,-8,2,2);
            rect('#f9cd70',-6,0,7,3); rect('#c8e8ef',-12,10,27,2);
          } else {
            // Animated four-point pixel stars with warm outlines.
            const pulse = .65 + .35 * Math.sin(time / 600 + i);
            ctx.globalAlpha = pulse;
            rect('#d5b58d',-3,-11,6,22); rect('#d5b58d',-11,-3,22,6);
            rect('#fff1ad',-2,-10,4,20); rect('#fff1ad',-10,-2,20,4);
            rect('#fffbe1',-4,-4,8,8); rect('#fff',-1,-3,2,6);
            rect('#fff',14,-12,2,6); rect('#fff',12,-10,6,2);
          }
          ctx.restore();
        });
      }

      render(currentTime) {
        this.renderTime = currentTime;
        const ctx = this.scene.getContext('2d');
        ctx.setTransform(this.scene.width / this.canvas.width, 0, 0, this.scene.height / this.canvas.height, 0, 0);
        const cw = this.canvas.width;
        const ch = this.canvas.height;
        const W = this.W;
        const H = this.H;
        const cs = this.cellSize;
        const grid = this.grid;

        this.renderWorld(ctx, currentTime);

        this.renderClouds(ctx, currentTime);

        // E. Render Multi-colored Dreamy Clouds (White, Pink, Lavender, Peach)
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const type = grid[y * W + x];
            if (type === CELL_AIR) continue;
            const px = x * cs;
            const py = y * cs;

            if (isCloud(type)) {
              // Cloud volume is drawn as a cached pixel texture, masked by the dig grid.
              continue;
            } else if (type === CELL_ROCK) {
              if (x < 2 || x >= W - 2 || y >= H - 1) continue;
              ctx.fillStyle = ({agent:"#627e8b",luxury:"#ba9861",christmas:"#b9657a",halloween:"#80629e",space:"#7c7fab"})[LEVELS[this.currentLevelIdx].theme] || "#bd9dbd";
              ctx.fillRect(px, py, cs, cs);
              ctx.fillStyle = "#e3c5da";
              ctx.fillRect(px + 1, py + 1, cs - 2, cs - 2);
              if ((x + y) % 4 === 0) {
                ctx.fillStyle = "#f59e0b";
                ctx.fillRect(px + 3, py + 3, 2, 2);
              }
            }
          }
        }

        this.renderRelays(ctx,currentTime);
        this.renderTreasures(ctx, currentTime);
        this.renderHazards(ctx, currentTime);

        // F. Celestial Star Ducks
        this.ducks.forEach(d => {
          ctx.save();
          ctx.translate(d.x * cs, d.y * cs);
          ctx.strokeStyle = "#fef08a";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(3, -11, 7, 2.5, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = d.isCollected ? "#fde047" : "#eab308";
          ctx.beginPath();
          ctx.ellipse(0, 2, 11, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(5, -4, 6.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.ellipse(-3, 1, 4.5, 3, -0.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#f97316";
          ctx.beginPath();
          ctx.ellipse(11, -3, 4, 2.2, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#1e1b4b";
          ctx.beginPath();
          ctx.arc(5, -5, 1.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // G. Celestial Starlight Water Stream
        this.particles.forEach(p => {
          const px = p.x * cs;
          const py = p.y * cs;
          ctx.fillStyle = this.isDirty ? "rgba(143,143,72,.35)" : "rgba(56,189,248,.38)";
          ctx.beginPath();
          ctx.arc(px, py, 5.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = this.isDirty ? "#93935f" : p.star ? "#f6d87e" : "#38bdf8";
          ctx.beginPath();
          ctx.arc(px, py, 3.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.fillRect(px - 1.2, py - 1.2, 2.4, 2.4);
        });

        // H. Cloud Mist & Star Sparks
        this.crumbs.forEach(c => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, c.life / c.maxLife);
          if (c.isStar) {
            ctx.fillStyle = c.color;
            ctx.fillRect(c.x - c.radius * 1.6, c.y - 0.6, c.radius * 3.2, 1.2);
            ctx.fillRect(c.x - 0.6, c.y - c.radius * 1.6, 1.2, c.radius * 3.2);
          } else {
            ctx.fillStyle = c.color;
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });
        this.ctx.imageSmoothingEnabled = false;
        this.ctx.clearRect(0, 0, cw, ch);
        this.ctx.drawImage(this.scene, 0, 0, cw, ch);
      }
    }

    // Launch game on DOMContentLoaded or immediate
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => new GameEngine());
    } else {
      new GameEngine();
    }
  </script>
</body>
</html>
